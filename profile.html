<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My profile – Campus Skill</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stylesheet.css"></head><body>
<header id="subhdr"></header>
<main class="page"><div class="wrap" id="root"><p class="msg" id="msg" role="status"></p></div></main>
<div class="toast" id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="app.js"></script>
<script>
const { sb, $, esc, ini, toast } = CS;
let U, P, S = [], M = [], J = [], R = {}, N = [], Q = [], pj = null, edit = false, isAdm = false;
const imgsOf = s => (s || "").split(",").map(u => u.trim()).filter(Boolean);
const pfList = () => ((P && P.portfolio) || "").split(",").map(u => u.trim()).filter(Boolean);
const OPT = [["department", "Department"], ["headline", "Headline (shown on your card)"], ["bio", "Short bio"]];
const F = [["full_name", "Full name"], ["phone", "Phone"], ["enrollment_no", "Enrollment no."], ["college", "College"], ["address", "Address"]];
(async () => {
  if (!CS.ok) { $("msg").className = "msg err"; $("msg").textContent = "Add your Supabase URL and anon key in config.js first."; return }
  const s = await CS.session();
  if (!s) { location.href = "login.html?next=profile.html"; return }
  U = s.user; await load();
  if (location.hash) { const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView() }
})();
async function load() {
  P = await CS.profile(U.id);
  const r = await sb.from("skills").select("*").eq("user_id", U.id).order("created_at", { ascending: false });
  S = r.data || [];
  R = {}; if (S.length) { const rr = await sb.from("skill_ratings").select("*").in("skill_id", S.map(x => x.id)); (rr.data || []).forEach(x => R[x.skill_id] = x) }
  const pr = await sb.from("projects").select("*").eq("user_id", U.id).order("created_at", { ascending: false }); J = pr.data || [];
  const ia = await sb.rpc("is_admin"); isAdm = ia.data === true;   // shows the Admin button
  const nn = await sb.from("notifications").select("*").eq("user_id", U.id).order("created_at", { ascending: false }).limit(30); N = nn.data || [];
  const qq = await sb.from("requests").select("*").or(`requester_id.eq.${U.id},provider_id.eq.${U.id}`).order("created_at", { ascending: false }).limit(50); Q = qq.data || [];
  const m = await sb.from("messages").select("*").eq("to_user", U.id).order("created_at", { ascending: false }).limit(50);
  M = m.data || []; if (!P) edit = true; draw();
  const unread = M.filter(x => !x.is_read).map(x => x.id);   // mark as read after showing the "new" highlight
  if (unread.length) sb.from("messages").update({ is_read: true }).in("id", unread);
}
const rateOf = id => { const r = R[id]; if (!r) return `<small style="color:var(--muted)">No reviews yet</small>`; const n = Math.round(r.avg_rating);
  return `<span class="stars">${"★".repeat(n)}${"☆".repeat(5 - n)}</span> <small>${Number(r.avg_rating).toFixed(1)} (${r.review_count} review${r.review_count === 1 ? "" : "s"})</small>` };
const grab = () => { if (!pj || !$("pj-title")) return; pj.title = $("pj-title").value; pj.description = $("pj-desc").value; pj.github_url = $("pj-gh").value; pj._vl = $("pj-video").value };
function projPanel() {
  const old = (pj && pj.video_url) || "", ext = old && !old.includes("/storage/v1/");
  const form = pj ? `<form id="pjf" class="stack" novalidate style="margin-top:16px;border-top:1px solid var(--line);padding-top:16px"><h3 style="margin:0">${pj.id ? "Edit project" : "New sample project"}</h3>
    <div><label for="pj-title">Project title</label><input id="pj-title" maxlength="80" value="${esc(pj.title || "")}"></div>
    <div><label for="pj-desc">Description</label><textarea id="pj-desc" maxlength="600" placeholder="What did you build and which tools did you use?">${esc(pj.description || "")}</textarea></div>
    <div><label for="pj-gh">GitHub link (optional)</label><input id="pj-gh" type="url" placeholder="https://github.com/you/project" value="${esc(pj.github_url || "")}"></div>
    <div><label for="pj-video">Video link (optional: YouTube or a direct .mp4 link)</label><input id="pj-video" type="url" value="${esc(pj._vl !== undefined ? pj._vl : (ext ? old : ""))}"></div>
    <div><label for="pj-vfile">Or upload a video (mp4 or webm, up to 20 MB)</label><input id="pj-vfile" type="file" accept="video/mp4,video/webm">${old ? `<label style="font-weight:500;margin-top:8px"><input type="checkbox" id="pj-rmvid" style="width:auto;min-height:0"> Remove the current video</label>` : ""}</div>
    <div><label for="pj-files">Pictures (up to 4 in total, 2 MB each)</label>
      ${pj.images.length ? `<div class="pj-imgs" style="margin-bottom:8px">${pj.images.map((u, i) => `<div style="position:relative"><img src="${esc(u)}" alt=""><button type="button" class="x" style="top:4px;right:4px;width:30px;height:30px" data-rmimg="${i}" aria-label="Remove picture">✕</button></div>`).join("")}</div>` : ""}
      <input id="pj-files" type="file" accept="image/*" multiple></div>
    <div class="chan"><button class="btn btn-p" id="pj-save" type="submit">Save project</button><button class="btn btn-o" type="button" data-a="pjcancel">Cancel</button></div></form>` : "";
  const items = J.length ? J.map(x => { const im = imgsOf(x.images);
    return `<div class="sk"><div class="sk-h"><b>${esc(x.title)}</b><div class="chan"><button class="btn btn-o btn-sm" data-pjedit="${x.id}">Edit</button><button class="btn btn-o btn-sm" data-pjdel="${x.id}">Delete</button></div></div>
      ${x.description ? `<p>${esc(x.description)}</p>` : ""}<div class="proj">${x.github_url ? `<a href="${esc(x.github_url)}" target="_blank" rel="noopener noreferrer">GitHub</a> ` : ""}${x.video_url ? "· 🎬 video " : ""}${im.length ? `· 🖼 ${im.length} picture${im.length === 1 ? "" : "s"}` : ""}</div>
      ${im.length ? `<div class="pj-imgs">${im.map(u => `<img src="${esc(u)}" alt="" loading="lazy">`).join("")}</div>` : ""}</div>` }).join("")
    : `<p class="sub" style="margin:14px 0 0">No sample projects yet. Add one so people who need a service can see your work.</p>`;
  return `<div class="panel pw"><div class="sk-h"><h2>My sample projects</h2><button class="btn btn-a btn-sm" data-a="pjnew">+ Add project</button></div>${items}${form}</div>`;
}
async function saveProject() {
  const title = $("pj-title").value.trim(), description = $("pj-desc").value.trim(), gh = $("pj-gh").value.trim(), vl = $("pj-video").value.trim();
  if (!title) return toast("Give the project a title.");
  if (gh && !/^https:\/\/(www\.)?github\.com\//i.test(gh)) return toast("The GitHub link must start with https://github.com/");
  if (vl && !/^https?:\/\//i.test(vl)) return toast("The video link must start with https://");
  const imgs = [...pj.images], files = [...$("pj-files").files], vf = $("pj-vfile").files[0], rm = $("pj-rmvid") && $("pj-rmvid").checked;
  if (imgs.length + files.length > 4) return toast("You can keep up to 4 pictures per project.");
  if (files.some(f => f.size > 2e6)) return toast("Each picture must be under 2 MB.");
  if (vf && vf.size > 2e7) return toast("The video file must be under 20 MB.");
  const old = pj.video_url || "", ext = old && !old.includes("/storage/v1/");
  $("pj-save").disabled = true; toast("Saving…");
  const up = async f => {
    const path = `${U.id}/${Date.now()}-${f.name.replace(/[^\w.-]/g, "_")}`, r = await sb.storage.from("projects").upload(path, f, { contentType: f.type });
    if (r.error) throw new Error(/bucket not found/i.test(r.error.message) ? 'The "projects" storage bucket is missing. Run 5_storage_projects.sql in Supabase.' : r.error.message);
    return sb.storage.from("projects").getPublicUrl(path).data.publicUrl;
  };
  try {
    for (const f of files) imgs.push(await up(f));
    let video = vl || (ext ? null : old) || null; if (rm && !vl) video = null; if (vf) video = await up(vf);
    const row = { title, description: description || null, github_url: gh || null, video_url: video, images: imgs.join(",") || null };
    const { error } = pj.id ? await sb.from("projects").update(row).eq("id", pj.id) : await sb.from("projects").insert({ ...row, user_id: U.id });
    if (error) throw new Error(/relation|schema cache/i.test(error.message) ? "Run 4_ratings_projects.sql in Supabase first. (" + error.message + ")" : error.message);
    CS.track("project_add"); pj = null; toast("Project saved."); await load();
  } catch (err) { if ($("pj-save")) $("pj-save").disabled = false; toast(err.message) }
}
function notifPanel() {
  const n = N.filter(x => !x.is_read).length;
  return `<div class="panel pw" id="notifications"><div class="sk-h"><h2>Notifications ${n ? `<span class="badge">${n} new</span>` : ""}</h2>
    <div class="chan">${N.length ? `<button class="btn btn-o btn-sm" data-a="nread">Mark all read</button><button class="btn btn-o btn-sm" data-a="nclear">Clear</button>` : ""}</div></div>
    ${N.length ? N.map(x => `<div class="sk" style="${x.is_read ? "" : "border-color:var(--brand)"}"><div class="sk-h"><b>${esc(x.title)}</b><small style="color:var(--muted)">${esc(new Date(x.created_at).toLocaleString())}</small></div>${x.body ? `<p>${esc(x.body)}</p>` : ""}</div>`).join("")
      : `<p class="sub" style="margin:14px 0 0">No notifications yet.</p>`}</div>`;
}
const badgeFor = s => `<span class="badge${s === "accepted" || s === "completed" ? " g" : ""}">${esc(s)}</span>`;
function reqPanel() {
  const got = Q.filter(x => x.provider_id === U.id), sent = Q.filter(x => x.requester_id === U.id);
  const b = (id, st, label, cls) => `<button class="btn ${cls} btn-sm" data-rq="${id}" data-st="${st}">${label}</button>`;
  const row = (x, mine) => `<div class="sk"><div class="sk-h"><b>${esc(x.skill_title || "Skill")}</b>${badgeFor(x.status)}</div>
    <p>${mine ? "You asked for this skill" : "From " + esc(x.requester_name || "a student")}${x.note ? ": " + esc(x.note) : ""}</p>
    <div class="chan">${mine ? (["pending", "accepted"].includes(x.status) ? b(x.id, "cancelled", "Cancel request", "btn-o") : "")
      : x.status === "pending" ? b(x.id, "accepted", "Accept", "btn-p") + b(x.id, "declined", "Decline", "btn-o")
      : x.status === "accepted" ? b(x.id, "completed", "Mark completed", "btn-p") : ""}</div></div>`;
  const none = t => `<p class="sub" style="margin:10px 0 0">${t}</p>`;
  return `<div class="panel pw" id="requests"><h2>Service requests</h2>
    <h3 style="font-size:16px;margin:14px 0 0">Received</h3>${got.length ? got.map(x => row(x, false)).join("") : none("No one has requested your skills yet.")}
    <h3 style="font-size:16px;margin:18px 0 0">Sent</h3>${sent.length ? sent.map(x => row(x, true)).join("") : none("You haven't requested a service yet. Open a student on the home page to request one.")}</div>`;
}
function draw() {
  const p = P || { email: U.email };
  const av = p.avatar_url ? `<img class="bigav" src="${esc(p.avatar_url)}" alt="Profile photo">` : `<span class="bigav" aria-hidden="true">${esc(ini(p.full_name || U.email))}</span>`;
  const view = `<div class="dl"><div><small>Email</small><b>${esc(p.email)}</b></div>${F.slice(1).concat(OPT).map(([k, l]) => `<div><small>${l}</small><b>${esc(p[k] || "—")}</b></div>`).join("")}</div>`;
  const pf = pfList(), box = u => `background:url('${esc(u)}') center/cover`;
  const pfView = pf.length ? `<h3 style="margin:22px 0 10px">Portfolio</h3><div class="pf">${pf.map(u => `<div style="${box(u)}"></div>`).join("")}</div>` : "";
  const pfEdit = `<div><label for="pfiles">Portfolio images (up to 8, 2 MB each)</label><div class="pf" style="margin-bottom:10px">${pf.map((u, i) => `<div style="${box(u)};position:relative"><button type="button" class="x" data-rmpf="${i}" aria-label="Remove image" style="top:4px;right:4px;width:30px;height:30px;font-size:14px">✕</button></div>`).join("")}</div><input id="pfiles" type="file" accept="image/*" multiple></div>`;
  const form = `<form id="pf" class="stack" novalidate><div><label for="photo">Profile photo</label><input id="photo" type="file" accept="image/*"></div>
    <div class="fgrid"><div class="full"><label for="email">Email (cannot be changed)</label><input id="email" value="${esc(p.email)}" disabled></div>
    ${F.concat(OPT).map(([k, l]) => `<div class="${["address", "full_name", "college", "headline", "bio"].includes(k) ? "full" : ""}"><label for="${k}">${l}</label><input id="${k}" value="${esc(p[k] || "")}"></div>`).join("")}</div>
    ${pfEdit}<button class="btn btn-p" type="submit">Save details</button></form>`;
  const unread = M.filter(m => !m.is_read).length;
  const msgs = M.length ? M.map(m => `<div class="sk" style="${m.is_read ? "" : "border-color:var(--brand)"}"><div class="sk-h"><b>${esc(m.from_name || "A student")}</b><small style="color:var(--muted)">${new Date(m.created_at).toLocaleString()}</small></div><p style="color:var(--ink);white-space:pre-wrap">${esc(m.body)}</p>${m.from_email ? `<a class="btn btn-o btn-sm" style="width:fit-content" href="mailto:${esc(m.from_email)}?subject=${encodeURIComponent("Re: your message on Campus Skill")}">Reply by email</a>` : ""}</div>`).join("") : `<p class="sub" style="margin:14px 0 0">No messages yet.</p>`;
  const skills = S.length ? S.map(s => edit
    ? `<div class="sk"><input id="t-${s.id}" value="${esc(s.title)}" aria-label="Skill title"><textarea id="d-${s.id}" aria-label="Description">${esc(s.description)}</textarea>
       <div class="chan"><button class="btn btn-p btn-sm" data-save="${s.id}">Save skill</button><button class="btn btn-o btn-sm" data-del="${s.id}">Delete</button></div></div>`
    : `<div class="sk"><div class="sk-h"><b>${esc(s.title)}</b><span class="badge">${esc(s.category)}</span></div><div>${rateOf(s.id)}</div><p>${esc(s.description)}</p></div>`).join("")
    : `<p class="sub" style="margin:14px 0 0">No skills listed yet. Add your first one.</p>`;
  $("root").innerHTML = `<div class="panel pw"><div class="pr-head">${av}
    <div style="flex:1;min-width:200px"><h1>${esc(p.full_name || "Complete your profile")}</h1><p class="sub" style="margin:0 0 8px">${esc(p.college || "")}</p><span class="badge g">✓ Verified student</span></div>
    <div class="chan">${isAdm ? `<a class="btn btn-a btn-sm" href="admin.html">Admin dashboard</a>` : ""}<button class="btn btn-o btn-sm" data-a="edit">${edit ? "Done editing" : "✎ Edit details & skills"}</button><button class="btn btn-o btn-sm" data-a="out">Log out</button></div></div>
    ${edit ? form : view + pfView}</div>
    ${notifPanel()}${reqPanel()}
    <div class="panel pw"><div class="sk-h"><h2>My skills</h2><a class="btn btn-a btn-sm" href="skill.html">+ Add skill</a></div>${skills}</div>
    ${projPanel()}
    <div class="panel pw" id="messages"><div class="sk-h"><h2>Messages ${unread ? `<span class="badge">${unread} new</span>` : ""}</h2></div>${msgs}</div>`;
}
$("root").addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.a === "edit") { if (!P) return toast("Save your details first."); edit = !edit; draw() }
  if (b.dataset.a === "out") { await sb.auth.signOut(); location.href = "index.html" }
  if (b.dataset.rmpf !== undefined) {
    const list = pfList(), [gone] = list.splice(+b.dataset.rmpf, 1);
    const { error } = await sb.from("profiles").update({ portfolio: list.join(",") }).eq("id", U.id);
    if (error) return toast(error.message);
    const key = (gone.split("/portfolio/")[1] || "").split("?")[0];
    if (key) await sb.storage.from("portfolio").remove([decodeURIComponent(key)]);
    P.portfolio = list.join(","); draw(); return;
  }
  if (b.dataset.a === "nread") { const { error } = await sb.from("notifications").update({ is_read: true }).eq("user_id", U.id).eq("is_read", false); if (error) return toast(error.message); N.forEach(x => x.is_read = true); draw(); return }
  if (b.dataset.a === "nclear") { const { error } = await sb.from("notifications").delete().eq("user_id", U.id); if (error) return toast(error.message); N = []; draw(); return }
  if (b.dataset.rq) { const { error } = await sb.from("requests").update({ status: b.dataset.st }).eq("id", b.dataset.rq); if (error) return toast(error.message); toast("Request " + b.dataset.st + "."); await load(); return }
  if (b.dataset.a === "pjnew") { pj = { images: [] }; draw(); return }
  if (b.dataset.a === "pjcancel") { pj = null; draw(); return }
  if (b.dataset.pjedit) { const x = J.find(y => y.id === b.dataset.pjedit); pj = { ...x, images: imgsOf(x.images) }; draw(); return }
  if (b.dataset.rmimg !== undefined) { grab(); pj.images.splice(+b.dataset.rmimg, 1); draw(); return }
  if (b.dataset.pjdel && confirm("Delete this project?")) {
    const x = J.find(y => y.id === b.dataset.pjdel), { error } = await sb.from("projects").delete().eq("id", x.id);
    if (error) return toast(error.message);
    const cut = "/storage/v1/object/public/projects/", keys = [...imgsOf(x.images), x.video_url || ""].filter(u => u.includes(cut)).map(u => decodeURIComponent(u.split(cut)[1].split("?")[0]));
    if (keys.length) await sb.storage.from("projects").remove(keys);
    J = J.filter(y => y.id !== x.id); draw(); toast("Project deleted."); return;
  }
  if (b.dataset.save) {
    const id = b.dataset.save, title = $("t-" + id).value.trim(), description = $("d-" + id).value.trim();
    if (!title || !description) return toast("Title and description can't be empty.");
    const { error } = await sb.from("skills").update({ title, description }).eq("id", id);
    toast(error ? error.message : "Skill updated."); if (!error) { const s = S.find(x => x.id === id); s.title = title; s.description = description }
  }
  if (b.dataset.del && confirm("Delete this skill?")) {
    const { error } = await sb.from("skills").delete().eq("id", b.dataset.del);
    if (error) return toast(error.message); S = S.filter(x => x.id !== b.dataset.del); draw(); toast("Skill deleted.");
  }
});
$("root").addEventListener("submit", async e => {
  e.preventDefault();
  if (e.target.id === "pjf") return saveProject();
  const row = { id: U.id, email: U.email }; F.concat(OPT).forEach(([k]) => row[k] = $(k).value.trim());
  if (F.some(([k]) => !row[k])) return toast("Fill in every field.");
  const f = $("photo").files[0]; row.avatar_url = P?.avatar_url || null;
  if (f) {
    if (f.size > 2e6) return toast("Photo must be under 2 MB.");
    const path = U.id + "/avatar", up = await sb.storage.from("avatars").upload(path, f, { upsert: true, contentType: f.type });
    if (up.error) return toast(up.error.message);
    row.avatar_url = sb.storage.from("avatars").getPublicUrl(path).data.publicUrl + "?t=" + Date.now();
  }
  const list = pfList(), files = [...($("pfiles") ? $("pfiles").files : [])];
  if (list.length + files.length > 8) return toast("You can keep up to 8 portfolio images.");
  for (const f of files) {
    if (f.size > 2e6) return toast(f.name + " is over 2 MB.");
    const path = `${U.id}/${Date.now()}-${f.name.replace(/[^\w.-]/g, "_")}`, r = await sb.storage.from("portfolio").upload(path, f, { contentType: f.type });
    if (r.error) return toast(r.error.message);
    list.push(sb.storage.from("portfolio").getPublicUrl(path).data.publicUrl);
  }
  row.portfolio = list.join(",");
  const { error } = await sb.from("profiles").upsert(row);
  if (error) return toast(error.message);
  toast("Profile saved."); await load();
});
</script></body></html>
